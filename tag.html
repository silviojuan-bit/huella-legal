<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/huella-icon.png" type="image/png" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <title>Huella — Ficha de emergencia</title>
  <style>
    :root {
      --cream: #F9F7F2;
      --terracotta: #C85A3C;
      --forest: #3E6B4F;
      --text: #1C1C1C;
      --muted: #6B6B6B;
      --border: #E8E4DC;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 1.25rem;
    }
    .brand { display: flex; align-items: center; gap: .5rem; margin: 1rem 0 1.5rem; font-weight: 700; }
    .mark { width: 36px; height: 36px; border-radius: 12px; background: var(--terracotta); color: #fff; display:flex; align-items:center; justify-content:center; }
    .card {
      width: 100%; max-width: 420px; background: var(--white); border-radius: 20px;
      border: 1px solid var(--border); padding: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .lost {
      background: var(--terracotta); color: #fff; font-weight: 900; text-align: center;
      padding: .75rem; border-radius: 12px; margin-bottom: 1rem; letter-spacing: .04em;
    }
    h1 { margin: 0 0 .75rem; font-size: 1.75rem; }
    .line { margin: .55rem 0; line-height: 1.45; }
    .muted { color: var(--muted); font-size: .85rem; margin-top: 1.25rem; }
    ul.list { margin: .25rem 0 .55rem 1.6rem; padding: 0; line-height: 1.45; }
    ul.list li { margin: .2rem 0; }
    .note { white-space: pre-wrap; }
    .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }
    a.tel { color: var(--forest); font-weight: 700; text-decoration: none; }
    img.photo, .photo-fallback {
      width: 96px; height: 96px; border-radius: 48px; display: block; margin: 0 auto 1rem;
      border: 3px solid var(--terracotta); background: #FBEFE6; object-fit: cover;
    }
    .notify { margin-top: 1.25rem; padding: 1rem; border-radius: 14px; background: #F3F7F4; border: 1px solid #D7E5DB; }
    .notify button { width: 100%; padding: .85rem; border: 0; border-radius: 12px; background: var(--forest); color: #fff; font-weight: 800; font-size: 1rem; margin-top: .6rem; }
    .notify button[disabled] { opacity: .6; }
    .notify textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: .6rem; font: inherit; margin-top: .5rem; }
    .notify label { display: flex; gap: .5rem; align-items: flex-start; margin-top: .6rem; font-size: .9rem; }
    .photo-fallback {
      display: flex; align-items: center; justify-content: center;
      color: var(--terracotta); font-size: 2.1rem; line-height: 1;
    }
  </style>
</head>
<body>
  <div class="brand"><div class="mark">🐾</div> Huella</div>
  <div class="card" id="card">
    <p class="empty">Cargando ficha…</p>
  </div>
  <p class="muted">Ficha pública de emergencia. No muestra microchip ni dirección completa por defecto.</p>
  <script>
    function b64UrlToJson(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      try {
        const bin = atob(s);
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch (e2) { return null; }
      }
    }
    function esc(t) {
      return String(t || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function speciesCopy(species) {
      var s = String(species == null ? '' : species).trim().toLowerCase();
      if (s === 'gato' || s === 'gata' || s === 'cat' || s === 'felino' || s === 'felina') return 'gato';
      if (s === 'perro' || s === 'perra' || s === 'dog' || s === 'canino' || s === 'canina') return 'perro';
      return 'mascota';
    }
    function looksLikePhone(value) {
      var t = String(value || '').trim();
      if (!t) return false;
      return t.replace(/\D/g, '').length >= 6 && /^[\d\s().+\-]+$/.test(t);
    }
    function contactHtml(data) {
      var name = String(data.ownerName || '').trim();
      var phone = String(data.phone || '').trim();
      var nameIsPhone = looksLikePhone(name);
      var tutor = name && !nameIsPhone ? name : '';
      var tel = phone || (nameIsPhone ? name : '');
      var html = '';
      if (tutor) html += '<p class="line">Tutor: ' + esc(tutor) + '</p>';
      if (tel) html += '<p class="line">Teléfono: ' + telLink(tel) + '</p>';
      return html;
    }
    function lostBanner(species) {
      var copy = speciesCopy(species);
      var phrase = copy === 'mascota' ? 'MASCOTA PERDIDA' : copy.toUpperCase() + ' PERDIDO';
      return 'SE BUSCA · ' + phrase;
    }
    function fmtDate(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
      return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(iso);
    }
    function line(icon, label, value) {
      if (!value) return '';
      return '<p class="line">' + icon + ' ' + (label ? label + ': ' : '') + esc(value) + '</p>';
    }
    function listHtml(icon, label, items) {
      if (!Array.isArray(items) || !items.length) return '';
      return '<p class="line" style="margin-bottom:0">' + icon + ' ' + label + ':</p><ul class="list">' +
        items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    }
    function telLink(tel) {
      return '<a class="tel" href="tel:' + esc(String(tel).replace(/[^\d+]/g, '')) + '">' + esc(tel) + '</a>';
    }
    function vetHtml(data) {
      var who = [data.vn, data.vet].filter(Boolean).map(esc).join(' · ');
      if (!who && !data.vetPhone) return '';
      return '<p class="line">🏥 Veterinario: ' + who + (data.vetPhone ? (who ? ' · ' : '') + telLink(data.vetPhone) : '') + '</p>';
    }
    function photoHtml(src) {
      var fallback = '<div class="photo-fallback" aria-hidden="true">🐾</div>';
      // Only the photo the owner chose to publish (Huella's Firebase Storage) or an old inline image.
      var ok = typeof src === 'string' &&
        ((src.length < 400 && src.indexOf('https://firebasestorage.googleapis.com/') === 0) ||
          /^data:image\/(jpeg|png|webp);base64,/.test(src));
      if (!ok) return fallback;
      return '<img class="photo" alt="Foto" referrerpolicy="no-referrer" loading="eager" src="' + esc(src) + '" onerror="this.outerHTML=\'<div class=photo-fallback aria-hidden=true>🐾</div>\'" />';
    }
    // Avisar a la familia (solo si el tutor lo activó en la app). Deja una nota pequeña en
    // el buzón de su app (Firebase Storage). La ubicación solo si se marca, y redondeada (~1 km).
    var BUCKET = 'huella-app-36f7b.firebasestorage.app';
    function mailbox(data) {
      var m = /^([A-Za-z0-9]{10,64})\.([a-z0-9]{24})$/.exec(String(data.nt || ''));
      return m ? { uid: m[1], token: m[2] } : null;
    }
    function notifyHtml(data) {
      if (!mailbox(data)) return '';
      return '<div class="notify" id="notify">' +
        '<b>¿Has encontrado a ' + esc(data.name) + '?</b>' +
        '<p class="line" style="margin:.3rem 0 0">Avisa a su familia: les llegará un aviso en la app Huella.</p>' +
        '<textarea id="nmsg" rows="2" maxlength="280" placeholder="Mensaje (opcional): dónde está, tu teléfono…"></textarea>' +
        '<label><input type="checkbox" id="nloc"> Compartir mi ubicación aproximada (unos 1 km, no la exacta)</label>' +
        '<button id="nbtn" type="button">Avisar a su familia</button>' +
        '<p class="muted" id="nst" style="margin-top:.5rem"></p></div>';
    }
    function rid() { var s = ''; while (s.length < 20) s += Math.floor(Math.random() * 36).toString(36); return s.slice(0, 20); }
    function send(box, body) {
      var path = 'n/' + box.uid + '/' + box.token + '/' + rid() + '.json';
      return fetch('https://firebasestorage.googleapis.com/v0/b/' + BUCKET + '/o?uploadType=media&name=' + encodeURIComponent(path), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(function (r) { if (!r.ok) throw new Error(r.status); });
    }
    function wireNotify(data) {
      var box = mailbox(data); var btn = document.getElementById('nbtn');
      if (!box || !btn) return;
      btn.onclick = function () {
        var st = document.getElementById('nst');
        var body = { at: new Date().toISOString() };
        var msg = (document.getElementById('nmsg').value || '').trim().slice(0, 280);
        if (msg) body.msg = msg;
        btn.disabled = true; st.textContent = 'Enviando…';
        var done = function () {
          send(box, body).then(function () {
            st.textContent = '¡Gracias! Hemos avisado a su familia.'; btn.textContent = 'Aviso enviado';
          }).catch(function () { st.textContent = 'No se ha podido enviar. Llama al teléfono de arriba si lo hay.'; btn.disabled = false; });
        };
        if (document.getElementById('nloc').checked && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function (p) {
            body.lat = Math.round(p.coords.latitude * 100) / 100;
            body.lng = Math.round(p.coords.longitude * 100) / 100;
            body.acc = 1000; done();
          }, done, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
        } else done();
      };
    }
    const hash = location.hash || '';
    const m = hash.match(/[#&?]p=([^&]+)/);
    const data = m ? b64UrlToJson(decodeURIComponent(m[1])) : null;
    const el = document.getElementById('card');
    if (!data || !data.name) {
      el.innerHTML = '<p class="empty">Esta ficha no tiene datos. Abre el enlace generado desde la app Huella.</p>';
    } else {
      el.innerHTML =
        (data.lost ? '<div class="lost">' + lostBanner(data.species) + '</div>' : '<p class="muted" style="margin-top:0">Ficha de emergencia</p>') +
        photoHtml(data.photo) +
        '<h1>' + esc(data.name) + '</h1>' +
        contactHtml(data) +
        line('⚠️', 'Alergias', data.allergies) +
        line('🩺', 'Enfermedades', data.ill) +
        (data.it ? '<p class="line note">📝 ' + esc(data.it) + '</p>' : '') +
        (Array.isArray(data.ms) && data.ms.length ? listHtml('💊', 'Medicación', data.ms) : line('💊', 'Medicación', data.meds)) +
        line('🥣', 'Puede comer', data.fd) +
        line('⚖️', 'Cantidad al día', data.am) +
        listHtml('🕒', 'Comidas', data.mt) +
        vetHtml(data) +
        line('📍', '', data.city) +
        (data.updated ? '<p class="muted">Actualizado ' + fmtDate(data.updated) + '</p>' : '') +
        notifyHtml(data);
      wireNotify(data);
    }
  </script>
</body>
</html>
